version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-chatgon_production}
      POSTGRES_USER: ${POSTGRES_USERNAME:-chatgon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME:-chatgon}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      sh -c "redis-server
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  chatgon:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Rails
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "true"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Secret key base required}
      FRONTEND_URL: ${FRONTEND_URL:?Frontend URL required}

      # PostgreSQL
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-chatgon_production}
      POSTGRES_USERNAME: ${POSTGRES_USERNAME:-chatgon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}

      # Redis
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      # Optional
      RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-5}
      SIDEKIQ_CONCURRENCY: ${SIDEKIQ_CONCURRENCY:-10}
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # Installation Config
      INSTALLATION_NAME: ${INSTALLATION_NAME:-ChatGon}
    volumes:
      - storage_data:/app/storage
      - public_data:/app/public

  sidekiq:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    command: bundle exec sidekiq -C config/sidekiq.yml
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Rails
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "true"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Secret key base required}
      FRONTEND_URL: ${FRONTEND_URL:?Frontend URL required}

      # PostgreSQL
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-chatgon_production}
      POSTGRES_USERNAME: ${POSTGRES_USERNAME:-chatgon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}

      # Redis
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      # Sidekiq
      SIDEKIQ_CONCURRENCY: ${SIDEKIQ_CONCURRENCY:-10}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - storage_data:/app/storage

volumes:
  postgres_data:
  redis_data:
  storage_data:
  public_data:

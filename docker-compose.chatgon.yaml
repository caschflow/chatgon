version: '3.8'

services:
  # Servicio de migración (se ejecuta primero)
  chatgon-migrate:
    image: chatwoot/chatwoot:latest
    environment:
      - RAILS_ENV=production
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - POSTGRES_HOST=chatgon-db
      - POSTGRES_USERNAME=${POSTGRES_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DATABASE=${POSTGRES_DATABASE}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@chatgon-redis:6379/0
    depends_on:
      chatgon-db:
        condition: service_healthy
      chatgon-redis:
        condition: service_healthy
    command: ['bundle', 'exec', 'rails', 'db:prepare']
    restart: "no"

  # Servicio de configuración de brand (se ejecuta después de migrate)
  chatgon-brand-setup:
    image: chatwoot/chatwoot:latest
    environment:
      - RAILS_ENV=production
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - POSTGRES_HOST=chatgon-db
      - POSTGRES_USERNAME=${POSTGRES_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DATABASE=${POSTGRES_DATABASE}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@chatgon-redis:6379/0
      # Branding Configuration
      - INSTALLATION_NAME=${INSTALLATION_NAME:-ChatGon}
      - BRAND_NAME=${BRAND_NAME:-ChatGon}
      - BRAND_URL=${BRAND_URL:-https://chat.monexgon.app}
      - WIDGET_BRAND_URL=${WIDGET_BRAND_URL:-https://chat.monexgon.app}
      - BRAND_COLOR=${BRAND_COLOR:-#2781F6}
      - LOGO=${LOGO:-/brand-assets/logo.svg}
      - LOGO_DARK=${LOGO_DARK:-/brand-assets/logo_dark.svg}
      - LOGO_THUMBNAIL=${LOGO_THUMBNAIL:-/brand-assets/logo_thumbnail.svg}
    depends_on:
      chatgon-db:
        condition: service_healthy
      chatgon-redis:
        condition: service_healthy
      chatgon-migrate:
        condition: service_completed_successfully
    command: >
      sh -c "
      echo '=========================================='
      echo 'ChatGon Brand Setup & Configuration'
      echo '=========================================='
      bundle exec rails runner '
        # Configure branding
        configs = {
          \"INSTALLATION_NAME\" => ENV[\"INSTALLATION_NAME\"],
          \"BRAND_NAME\" => ENV[\"BRAND_NAME\"],
          \"BRAND_URL\" => ENV[\"BRAND_URL\"],
          \"WIDGET_BRAND_URL\" => ENV[\"WIDGET_BRAND_URL\"],
          \"BRAND_COLOR\" => ENV[\"BRAND_COLOR\"],
          \"LOGO\" => ENV[\"LOGO\"],
          \"LOGO_DARK\" => ENV[\"LOGO_DARK\"],
          \"LOGO_THUMBNAIL\" => ENV[\"LOGO_THUMBNAIL\"]
        }
        configs.each do |key, value|
          config = InstallationConfig.find_by(name: key)
          if config && value.present?
            config.update(value: value)
            puts \"✓ Updated #{key} to #{value}\"
          end
        end

        # Clear premium warnings from Redis
        Redis::Alfred.delete(Redis::Alfred::CHATWOOT_INSTALLATION_CONFIG_RESET_WARNING)
        puts \"✓ Cleared premium config warnings from Redis\"

        puts \"=========================================\"
        puts \"✓ Brand configuration completed successfully\"
        puts \"==========================================\"
      '
      "
    restart: "no"

  chatgon-app:
    image: chatwoot/chatwoot:latest
    container_name: chatgon-app
    environment:
      - RAILS_ENV=production
      - NODE_ENV=production
      - INSTALLATION_ENV=docker
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - FRONTEND_URL=${FRONTEND_URL}
      - DEFAULT_LOCALE=es
      - ENABLE_ACCOUNT_SIGNUP=true
      - CREATE_NEW_ACCOUNT_FROM_DASHBOARD=true
      - FORCE_SSL=false
      # ChatGon Independent Configuration
      - DISABLE_TELEMETRY=true
      - CHATGON_HUB_URL=${FRONTEND_URL}
      # Database
      - POSTGRES_HOST=chatgon-db
      - POSTGRES_USERNAME=${POSTGRES_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DATABASE=${POSTGRES_DATABASE}
      # Redis
      - REDIS_URL=redis://:${REDIS_PASSWORD}@chatgon-redis:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      # Email
      - MAILER_SENDER_EMAIL=${MAILER_SENDER_EMAIL}
      - SMTP_DOMAIN=${SMTP_DOMAIN}
      - SMTP_ADDRESS=${SMTP_ADDRESS}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_AUTHENTICATION=${SMTP_AUTHENTICATION:-login}
      - SMTP_ENABLE_STARTTLS_AUTO=${SMTP_ENABLE_STARTTLS_AUTO:-true}
      # Branding
      - INSTALLATION_NAME=${INSTALLATION_NAME:-ChatGon}
      - BRAND_NAME=${BRAND_NAME:-ChatGon}
      - BRAND_URL=${BRAND_URL:-https://chat.monexgon.app}
      - WIDGET_BRAND_URL=${WIDGET_BRAND_URL:-https://chat.monexgon.app}
      - BRAND_COLOR=${BRAND_COLOR:-#2781F6}
      - LOGO=${LOGO:-/brand-assets/logo.svg}
      - LOGO_DARK=${LOGO_DARK:-/brand-assets/logo_dark.svg}
      - LOGO_THUMBNAIL=${LOGO_THUMBNAIL:-/brand-assets/logo_thumbnail.svg}
      - DISPLAY_MANIFEST=${DISPLAY_MANIFEST:-false}
      # Storage
      - ACTIVE_STORAGE_SERVICE=local
      # Performance
      - RAILS_MAX_THREADS=5
      - SIDEKIQ_CONCURRENCY=10
      # API Configuration
      - API_RATE_LIMIT=1000
      - CORS_ORIGINS=${FRONTEND_URL}
      - API_ACCESS_TOKEN_EXPIRY=24
    ports:
      - "3000:3000"
    volumes:
      - chatgon_storage:/app/storage
      - chatgon_public:/app/public
    depends_on:
      chatgon-db:
        condition: service_healthy
      chatgon-redis:
        condition: service_healthy
      chatgon-migrate:
        condition: service_completed_successfully
      chatgon-brand-setup:
        condition: service_completed_successfully
    restart: unless-stopped
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']

  chatgon-sidekiq:
    image: chatwoot/chatwoot:latest
    container_name: chatgon-sidekiq
    environment:
      - RAILS_ENV=production
      - NODE_ENV=production
      - INSTALLATION_ENV=docker
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      # ChatGon Independent Configuration
      - DISABLE_TELEMETRY=true
      # Database
      - POSTGRES_HOST=chatgon-db
      - POSTGRES_USERNAME=${POSTGRES_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DATABASE=${POSTGRES_DATABASE}
      # Redis
      - REDIS_URL=redis://:${REDIS_PASSWORD}@chatgon-redis:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      # Performance
      - SIDEKIQ_CONCURRENCY=10
    volumes:
      - chatgon_storage:/app/storage
    depends_on:
      chatgon-db:
        condition: service_healthy
      chatgon-redis:
        condition: service_healthy
      chatgon-migrate:
        condition: service_completed_successfully
      chatgon-brand-setup:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pgrep", "-f", "sidekiq"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']

  chatgon-db:
    image: pgvector/pgvector:pg16
    container_name: chatgon-db
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - chatgon_postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME} -d ${POSTGRES_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
    
  chatgon-redis:
    image: redis:7-alpine
    container_name: chatgon-redis
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - chatgon_redis:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    
volumes:
  chatgon_postgres:
    driver: local
  chatgon_redis:
    driver: local
  chatgon_storage:
    driver: local
  chatgon_public:
    driver: local

networks:
  default:
    name: chatgon-network
    driver: bridge
version: '3.8'

services:
  chatgon-app:
    image: chatwoot/chatwoot:latest
    container_name: chatgon-app
    environment:
      - RAILS_ENV=production
      - NODE_ENV=production
      - INSTALLATION_ENV=docker
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - FRONTEND_URL=${FRONTEND_URL}
      - DEFAULT_LOCALE=es
      - ENABLE_ACCOUNT_SIGNUP=api_only
      - CREATE_NEW_ACCOUNT_FROM_DASHBOARD=false
      - FORCE_SSL=true
      # Database
      - POSTGRES_HOST=chatgon-db
      - POSTGRES_USERNAME=${POSTGRES_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DATABASE=${POSTGRES_DATABASE}
      # Redis
      - REDIS_URL=redis://:${REDIS_PASSWORD}@chatgon-redis:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      # Email
      - MAILER_SENDER_EMAIL=${MAILER_SENDER_EMAIL}
      - SMTP_DOMAIN=${SMTP_DOMAIN}
      - SMTP_ADDRESS=${SMTP_ADDRESS}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_AUTHENTICATION=${SMTP_AUTHENTICATION:-login}
      - SMTP_ENABLE_STARTTLS_AUTO=${SMTP_ENABLE_STARTTLS_AUTO:-true}
      # Branding
      - INSTALLATION_NAME=ChatGon
      - BRAND_NAME=ChatGon
      # Storage
      - ACTIVE_STORAGE_SERVICE=local
      # Performance
      - RAILS_MAX_THREADS=5
      - SIDEKIQ_CONCURRENCY=10
      # API Configuration
      - API_RATE_LIMIT=1000
      - CORS_ORIGINS=${FRONTEND_URL}
      - API_ACCESS_TOKEN_EXPIRY=24
    ports:
      - "3000:3000"
    volumes:
      - chatgon_storage:/app/storage
      - chatgon_public:/app/public
    depends_on:
      - chatgon-db
      - chatgon-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']

  chatgon-sidekiq:
    image: chatwoot/chatwoot:latest
    container_name: chatgon-sidekiq
    environment:
      - RAILS_ENV=production
      - NODE_ENV=production
      - INSTALLATION_ENV=docker
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      # Database
      - POSTGRES_HOST=chatgon-db
      - POSTGRES_USERNAME=${POSTGRES_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DATABASE=${POSTGRES_DATABASE}
      # Redis
      - REDIS_URL=redis://:${REDIS_PASSWORD}@chatgon-redis:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      # Performance
      - SIDEKIQ_CONCURRENCY=10
    volumes:
      - chatgon_storage:/app/storage
    depends_on:
      - chatgon-db
      - chatgon-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pgrep", "-f", "sidekiq"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']

  chatgon-db:
    image: pgvector/pgvector:pg16
    container_name: chatgon-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - chatgon_postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME} -d ${POSTGRES_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"

  chatgon-redis:
    image: redis:7-alpine
    container_name: chatgon-redis
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - chatgon_redis:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  chatgon_postgres:
    driver: local
  chatgon_redis:
    driver: local
  chatgon_storage:
    driver: local
  chatgon_public:
    driver: local

networks:
  default:
    name: chatgon-network
    driver: bridge